<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura Colour Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#0c0a1d;--bg2:#1b1638;--ink:#f1ecfa;--mute:#b9b1d4;--acc:#b49be8;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a1d}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%) fixed var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.55}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 40px}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.center{text-align:center}
.title{font-size:clamp(2.4rem,7vw,4rem);letter-spacing:.01em}
.sub{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;color:var(--acc);margin:.2rem 0 .8rem}
.mute{color:var(--mute)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:24px;backdrop-filter:blur(10px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:12px 22px;border-radius:999px;cursor:pointer;transition:.2s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,#b49be8,#7dade8);color:#14122a;border:0;font-size:1.05rem;padding:14px 32px;box-shadow:0 0 30px rgba(180,155,232,.45)}
.btn:focus-visible,.card:focus-visible,.seg button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.seg{display:inline-flex;gap:6px;padding:5px;border:1px solid var(--line);border-radius:999px;background:var(--glass)}
.seg button{font:inherit;color:var(--mute);background:none;border:0;border-radius:999px;padding:9px 24px;cursor:pointer}
.seg button[aria-checked="true"]{background:var(--acc);color:#14122a;font-weight:500}
.prog{height:6px;border-radius:9px;background:var(--glass);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#b49be8,#65d6d1);transition:width .4s}
.qtxt{font-size:clamp(1.7rem,4.5vw,2.4rem);margin:14px 0 22px}
.cards{display:grid;gap:12px}
.card{font:inherit;text-align:left;color:var(--ink);display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--glass);cursor:pointer;transition:.2s}
.card:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.card[aria-checked="true"]{border-color:var(--acc);background:rgba(180,155,232,.22);box-shadow:0 0 22px rgba(180,155,232,.3)}
.card b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-weight:500;font-size:.85rem}
.card[aria-checked="true"] b{background:var(--acc);color:#14122a;border-color:transparent}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px}
.res{display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-items:start}
@media(min-width:860px){.res{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}.stick{position:sticky;top:16px}}
.fig{width:100%;max-width:460px;margin:0 auto;display:block}
.layer{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-bottom:14px;padding:16px 18px}
.sw{width:44px;height:44px;border-radius:50%;grid-row:span 3;box-shadow:0 0 22px currentColor}
.tag{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.layer h3{font-size:1.5rem}
.layer p{margin:0}
.ref{font-style:italic;color:var(--mute);font-size:.92rem}
.note{font-size:.8rem;color:var(--mute);max-width:640px;margin:26px auto 0;text-align:center}
.bd{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.bd span{font-size:.72rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line)}
.aura{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}
.aura.m{animation-duration:8s;animation-delay:-2s}
.aura.o{animation-duration:11s;animation-delay:-4s}


@keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.045);opacity:1}}
@media(prefers-reduced-motion:reduce){.aura,.fade{animation:none}.card,.btn,.prog i{transition:none}}
</style>
</head>

  Red:{hex:"#E65C65",qual:"grounding, determination, resilience and practical focus",word:"grounded determination",prompt:"Where could steady, practical action help you most this week?"},
  Orange:{hex:"#F5A15D",qual:"creativity, passion, activation and emotional expression",word:"creative spark",prompt:"What is one small way you could give your inspiration a voice today?"},
  Yellow:{hex:"#F4D66D",qual:"confidence, optimism, joy and personal expression",word:"optimistic confidence",prompt:"What recently made you feel genuinely proud or joyful?"},
  Green:{hex:"#78C9A4",qual:"compassion, sincerity, connection and openness",word:"sincere compassion",prompt:"Who in your life would value a moment of your undivided attention?"},
  Blue:{hex:"#7DADE8",qual:"calm, thoughtfulness, communication and stability",word:"calm reflection",prompt:"What would you like to say clearly, to yourself or someone else?"},
  Turquoise:{hex:"#65D6D1",qual:"renewal, adaptability, transition and fresh perspectives",word:"adaptable renewal",prompt:"What fresh perspective might be waiting if you loosened your grip a little?"},

  Purple:{hex:"#B49BE8",qual:"curiosity, intuition, imagination and exploration",word:"curious imagination",prompt:"What question have you been wanting to explore without needing an answer?"},
};

const Q = (t, a) => ({ t, a });
const QUESTIONS = [
  Q("What feels most natural to you?",[["Staying grounded and getting things done","Red"],["Creating and following inspiration","Orange"],["Expressing yourself confidently","Yellow"],["Caring for others and building connections","Green"]]),
  Q("How do people often describe you?",[["Calm and thoughtful","Blue"],["Adaptable and refreshing","Turquoise"],["Gentle and considerate","Pink"],["Curious and insightful","Purple"]]),
  Q("When life feels aligned, you feel most…",[["Stable and secure","Red"],["Energised and creative","Orange"],["Joyful and expressive","Yellow"],["Connected and compassionate","Green"]]),
  Q("Which inner quality resonates most strongly with you?",[["Thoughtful communication","Blue"],["Flexibility and flow","Turquoise"],["Tenderness and kindness","Pink"],["Imagination and curiosity","Purple"]]),
  Q("How do you naturally express yourself?",[["Carefully and thoughtfully","Blue"],["Gently and compassionately","Pink"],["Brightly and confidently","Yellow"],["Openly and sincerely","Green"]]),
  Q("What best describes your emotional style?",[["Grounded and practical","Red"],["Expressive and passionate","Orange"],["Caring and open-hearted","Green"],["Curious and intuitive","Purple"]]),
  Q("Which quality are you currently developing?",[["Confidence","Yellow"],["Adaptability and openness","Turquoise"],["Clear communication","Blue"],["Self-compassion","Pink"]]),
  Q("What best describes your present phase of life?",[["Seeking stability","Red"],["Exploring new creative energy","Orange"],["Building confidence","Yellow"],["Strengthening relationships","Green"]]),
  Q("What does your current energy feel like?",[["Quiet and reflective","Blue"],["Changing and evolving","Turquoise"],["Emotionally sensitive","Pink"],["Curious and imaginative","Purple"]]),
  Q("What are you most drawn towards right now?",[["Security and structure","Red"],["Creativity and movement","Orange"],["Joy and self-expression","Yellow"],["Deeper meaning and exploration","Purple"]]),
];

const GROUPS = [
  { key:"core", label:"Core Essence", aura:"Inner Aura", range:[0,3] },
  { key:"support", label:"Supporting Energy", aura:"Middle Aura", range:[4,6] },
  { key:"state", label:"Current Outer State", aura:"Outer Aura", range:[7,9] },
];

// Deterministic scoring: highest count wins; ties go to the colour of the earliest-answered question.
function score(answers) {
  return GROUPS.map(g => {
    const counts = {}, first = {};
    for (let i = g.range[0]; i <= g.range[1]; i++) {
      const c = QUESTIONS[i].a[answers[i]][1];
      counts[c] = (counts[c] || 0) + 1;
      if (first[c] === undefined) first[c] = i;
    }
    const winner = Object.keys(counts).sort((a, b) => counts[b] - counts[a] || first[a] - first[b])[0];
    return { ...g, winner, counts };
  });
}

const cap = s => s[0].toUpperCase() + s.slice(1);
function interpret(layer, c) {
  const q = COLOURS[c].qual;
  if (layer === "core") return `Your responses suggest a natural connection to ${q}.`;
  if (layer === "support") return `${cap(q)} may be qualities you draw on as you move through everyday experiences.`;
  return `Your present responses suggest a season of ${q}.`;
}
function summary([a, b, c]) {
  const W = n => COLOURS[n].word;
  if (a === b && b === c) return `${a} appears in every layer of your aura, a rare and consistent thread. Your essence, the energy you lean on and the season you are in all echo ${W(a)}, which may suggest a sense of coherence between who you are and where you are right now. It could be worth asking what would help this quality stay nourished rather than overextended.`;
  if (a === b) return `${a} runs through both your core and your supporting energy, giving ${W(a)} a steady, well-rooted presence in your inner world. Around it, ${c} is colouring your current season with ${W(c)}, an invitation to let something new sit alongside what already feels familiar.`;
  if (a === c) return `${a} frames your aura from the inside out: ${W(a)} is both who you are at heart and what you feel drawn towards now. Between them, ${b} offers ${W(b)} as a bridge, which may be the quality that helps you express your essence in daily life.`;
  if (b === c) return `At your core, ${a} brings ${W(a)}, while ${b} appears in both your supporting energy and your present state. That repetition may suggest ${W(b)} is something you are actively leaning on right now, with your deeper essence quietly holding the centre.`;
  return `At your core, ${W(a)} offers a foundation, while ${W(b)} supports how you express it day to day. Right now, ${W(c)} is softly colouring the edges of your experience. Together, ${a}, ${b} and ${c} may point to a thoughtful blend of depth, expression and change, a story that is still unfolding.`;
}

function Shape({ gender, ...p }) {
  return <g {...p} strokeLinejoin="round" strokeLinecap="round"><path d={BODY[gender]} /></g>;
}

function AuraFigure({ gender, colours }) {
  const hex = colours.map(c => COLOURS[c].hex);
  const reduce = typeof window !== "undefined" && !!window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const L = [
    { cls: "o", f: "bo", sw: 130, op: .85, h: hex[2] },
    { cls: "m", f: "bm", sw: 84, op: .9, h: hex[1] },
    { cls: "i", f: "bi", sw: 46, op: .92, h: hex[0] },
    
    
  ];
  const d = BODY[gender];
  const stops = [[0, .9], [.14, .35], [.3, 0], [.7, 0], [.86, .35], [1, .9]];
  return (
    <svg className="fig" viewBox="-90 -70 480 680" role="img" aria-label={`${gender} silhouette surrounded by ${colours.join(", ")} aura layers`}>
      <defs>
        <filter id="bo" x="-70%" y="-30%" width="240%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".010 .016" numOctaves="2" seed="4" result="n">{!reduce && <animate attributeName="baseFrequency" dur="16s" values=".010 .016;.014 .012;.010 .016" repeatCount="indefinite" />}</feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="60" result="d" /><feGaussianBlur in="d" stdDeviation="18" result="b" /><feColorMatrix in="b" type="saturate" values="2.4" /></filter>
        <filter id="bm" x="-60%" y="-25%" width="220%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".014 .02" numOctaves="2" seed="9" result="n" /><feDisplacementMap in="SourceGraphic" in2="n" scale="50" result="d" /><feGaussianBlur in="d" stdDeviation="16" result="b" /><feColorMatrix in="b" type="saturate" values="2.2" /></filter>
        <filter id="bi" x="-40%" y="-15%" width="180%" height="130%"><feTurbulence type="fractalNoise" baseFrequency=".012 .018" numOctaves="2" seed="2" result="n" /><feDisplacementMap in="SourceGraphic" in2="n" scale="30" result="d" /><feGaussianBlur in="d" stdDeviation="11" result="b" /><feColorMatrix in="b" type="saturate" values="2" /></filter><filter id="bh" x="-40%" y="-15%" width="180%" height="130%"><feGaussianBlur stdDeviation="4" /></filter>
        <filter id="hb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" /></filter>
        <linearGradient id="sk" gradientUnits="userSpaceOnUse" x1="0" y1="17" x2="0" y2="497"><stop offset="0" stopColor="#0d0b18" /><stop offset=".5" stopColor="#15112a" /><stop offset="1" stopColor="#07060d" /></linearGradient>
        <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="70" y1="0" x2="230" y2="0">
          {stops.map(([o, a]) => <stop key={o} offset={o} stopColor={hex[0]} stopOpacity={a} />)}
        </linearGradient>
        <clipPath id="cp"><path d={d} /></clipPath>
      </defs>
      {L.map(l => (
        <g key={l.cls} filter={`url(#${l.f})`} style={{ mixBlendMode: l.cls === "i" ? "normal" : "screen" }}>
          <g className={"aura " + l.cls}>
            <Shape gender={gender} fill={l.h} stroke={l.h} strokeWidth={l.sw} opacity={l.op} />
          </g>
        </g>
      ))}
      <g filter="url(#bh)" style={{ mixBlendMode: "screen" }}><Shape gender={gender} fill="none" stroke="#fff" strokeWidth="5" opacity=".28" /></g>
      <path d={d} fill="url(#sk)" />
      <path d={d} fill="url(#rim)" />
      <g clipPath="url(#cp)">
        <g filter="url(#hb)" fill="#fff" opacity=".09">
          {HL.flatMap(([dx, cy, rx, ry]) => [-1, 1].map(sg => <ellipse key={sg + "" + cy} cx={150 + sg * dx} cy={cy} rx={rx} ry={ry} />))}
        </g>
      </g>
    </svg>
  );
}

function Welcome({ gender, setGender, start }) {
  return (
    <div className="fade center">
      <h1 className="title">Aura Colour Studio</h1>
      <p className="sub">Discover the colours that reflect your inner world.</p>
      <p className="mute" style={{ maxWidth: 520, margin: "0 auto" }}>Explore your core essence, supporting qualities and current state through 10 thoughtful questions.</p>
      <div style={{ maxWidth: 300, margin: "0 auto" }}><AuraFigure gender={gender} colours={["Purple", "Turquoise", "Pink"]} /></div>
      <p className="mute" style={{ maxWidth: 520, margin: "0 auto 18px" }}>Answer ten short reflective questions, then watch three luminous layers of colour take shape around a figure. There are no right or wrong answers.</p>
      <div className="seg" role="radiogroup" aria-label="Choose a figure" style={{ marginBottom: 22 }}>
        {["Female", "Male"].map(g => <button key={g} role="radio" aria-checked={gender === g} onClick={() => setGender(g)}>{g}</button>)}
      </div>
      <div><button className="btn pri" onClick={start}>Begin Exploration</button></div>
      <p className="mute" style={{ fontSize: ".8rem", marginTop: 14 }}>The figure choice changes appearance only, never your results.</p>
      <Disclaimer />
    </div>
  );
}

function Disclaimer() {
  return <p className="note">This experience uses reflective questionnaire responses to generate a symbolic colour interpretation. It is intended for self-exploration and entertainment, not as a scientific assessment.</p>;
}

function Quiz({ idx, answers, pick, go, reveal, home }) {
  const q = QUESTIONS[idx], sel = answers[idx], last = idx === QUESTIONS.length - 1;
  const grp = GROUPS.find(g => idx >= g.range[0] && idx <= g.range[1]);
  return (
    <div style={{ maxWidth: 680, margin: "0 auto" }}>
      <div className="tag" style={{ display: "flex", justifyContent: "space-between" }}>
        <span>Question {idx + 1} of 10</span><span>{Object.keys(answers).length} answered</span>
      </div>
      <div className="prog" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow={idx + 1}><i style={{ width: `${((idx + 1) / 10) * 100}%` }} /></div>
      <div key={idx} className="fade panel" style={{ marginTop: 18 }}>
        <h2 className="qtxt">{q.t}</h2>
        <div className="cards" role="radiogroup" aria-label={q.t}>
          {q.a.map(([txt], i) => (
            <button key={i} className="card" role="radio" aria-checked={sel === i} onClick={() => pick(i)}>
              <b>{"ABCD"[i]}</b><span>{txt}</span>
            </button>
          ))}
        </div>
        <div className="nav">
          <button className="btn" onClick={() => (idx === 0 ? home() : go(idx - 1))}>{idx === 0 ? "Back to Start" : "Previous Question"}</button>
          {last
            ? <button className="btn pri" disabled={sel === undefined} onClick={reveal}>Reveal My Aura</button>
            : <span className="mute" style={{ fontSize: ".85rem" }}>Choose an answer to continue</span>}
        </div>
      </div>
      <Disclaimer />
    </div>
  );
}

    <div className="fade">

        <p className="mute" style={{ margin: 0 }}>A symbolic reflection of your responses</p>
      </div>
      <div className="res">
        <div className="stick"><AuraFigure gender={gender} colours={names} /></div>
        <div>
          {res.map(r => {
            const c = COLOURS[r.winner];
            return (
              <section key={r.key} className="panel layer" style={{ borderColor: c.hex + "66" }}>
                <div className="sw" style={{ background: c.hex, color: c.hex }} aria-hidden="true" />
                <div className="tag">{r.aura} · {r.label}</div>
                <h3>{r.label} — {r.winner}</h3>
                <p>{interpret(r.key, r.winner)}</p>
                <p className="ref" style={{ gridColumn: "1 / -1" }}>Reflect: {c.prompt}</p>
                <div className="bd" style={{ gridColumn: "1 / -1" }} aria-label="Score breakdown">
                  {Object.entries(r.counts).map(([k, v]) => <span key={k} style={{ borderColor: COLOURS[k].hex + "99" }}>{k} {v}</span>)}
                </div>
              </section>
            );
          })}
          <section className="panel" style={{ marginBottom: 14 }}>
            <div className="tag">Your colours together</div>
            <h3 style={{ fontSize: "1.5rem", margin: "4px 0 8px" }}>{names.join(" · ")}</h3>
            <p style={{ margin: 0 }}>{summary(names)}</p>
          </section>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button className="btn pri" style={{ padding: "12px 26px", fontSize: "1rem" }} onClick={retake}>Retake Questionnaire</button>
            <button className="btn" onClick={home}>Back to Start</button>
          </div>
        </div>
      </div>
      <Disclaimer />
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("welcome");
  const [gender, setGender] = useState("Female");
  const [idx, setIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const timer = useRef();
  const complete = Object.keys(answers).length === QUESTIONS.length;
  const top = () => window.scrollTo({ top: 0 });
  const start = () => { setScreen("quiz"); top(); };
  const retake = () => { clearTimeout(timer.current); setAnswers({}); setIdx(0); setScreen("quiz"); top(); };
  const home = () => { clearTimeout(timer.current); setAnswers({}); setIdx(0); setScreen("welcome"); top(); };
  const reveal = () => { if (complete) { setScreen("results"); top(); } };
  return (
    <main className="wrap">
      {screen === "welcome" && <Welcome gender={gender} setGender={setGender} start={start} />}
      {screen === "quiz" && <Quiz idx={idx} answers={answers} pick={i => { setAnswers(a => ({ ...a, [idx]: i })); if (idx < 9) { clearTimeout(timer.current); timer.current = setTimeout(() => setIdx(idx + 1), 380); } }} go={n => { clearTimeout(timer.current); setIdx(n); }} reveal={reveal} home={home} />}
      {screen === "results" && complete && <Results answers={answers} gender={gender} retake={retake} home={home} />}
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
